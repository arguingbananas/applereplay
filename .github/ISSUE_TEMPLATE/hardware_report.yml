name: Hardware or game report
description: What worked or didn't on your Apple TV, with your hub, stick, keyboard, controller, TV, or a game
labels: [compatibility]
body:
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works
        - Works with problems
        - Doesn't work
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: What you tried
      description: >
        The parts that matter: USB hub (powered or not), USB stick, keyboard,
        controller, TV, or the game's name in Total Replay. Make and model are
        enough; please don't include serial numbers.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened
      description: For problems, what you saw or heard, and when.
  - type: input
    id: commit
    attributes:
      label: Commit you built from
      description: "`git rev-parse --short HEAD` in your checkout."
