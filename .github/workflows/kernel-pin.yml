# Daily, while the kernel is pinned (hooks/customize.sh): is a newer Debian
# i386 kernel out that tests/known-bad-kernels doesn't list? If so it opens an
# issue, or updates the open one, and the run fails; once there is nothing to
# do (unpinned, or the new kernel added to known-bad-kernels) it closes it.
name: Kernel pin check

on:
  schedule:
    - cron: '23 7 * * *'    # daily, 07:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - hooks/customize.sh
      - tests/known-bad-kernels
      - .github/kernel-pin-check.sh
      - .github/workflows/kernel-pin.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: kernel-pin-check
  cancel-in-progress: false

jobs:
  kernel-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TITLE: A Debian kernel to unpin to is out
      GH_TOKEN: ${{ github.token }}
    steps:
      # By full SHA, so the code that runs can't change under the same name;
      # Dependabot (github-actions) proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ask Debian's archive
        id: check
        run: |
          status=0
          .github/kernel-pin-check.sh > report.md || status=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # 2 means the check didn't run; don't touch the issue on that.
          [ "$status" -ne 2 ]

      - name: Open, update or close the issue
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "in:title \"$TITLE\"" --json number,title \
              --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ "${{ steps.check.outputs.status }}" = 1 ]; then
              if [ -n "$number" ]; then
                  gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file report.md
              else
                  gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file report.md
              fi
          elif [ -n "$number" ]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "$(cat report.md)"
          fi

      - name: Fail when there is a kernel to unpin to
        if: steps.check.outputs.status == '1'
        run: exit 1
