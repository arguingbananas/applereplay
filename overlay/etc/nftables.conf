#!/usr/sbin/nft -f
# The box's firewall: it answers SSH, mDNS (the name applereplay.local) and
# ping, and nothing else, whatever gets installed later. It may start any
# connection itself (DHCP, time, apt). Loaded at boot by nftables.service.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif lo accept
        ct state established,related accept
        ct state invalid drop
        # IPv6 needs ICMPv6 to find its neighbours and router at all.
        meta l4proto { icmp, icmpv6 } accept
        tcp dport 22 accept
        udp dport 5353 accept
        # DHCP replies to a broadcast request match no connection.
        udp sport 67 udp dport 68 accept
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
}
