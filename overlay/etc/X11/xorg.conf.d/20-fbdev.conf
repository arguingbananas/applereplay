# X on the firmware's framebuffer (efifb). No shadow framebuffer: linapple only
# writes to the screen, so the shadow copy was pure cost, ~20% of the CPU in
# busy scenes (52-54 fps with it, 59-60 without).
Section "Device"
    Identifier "fbdev"
    Driver "fbdev"
    Option "ShadowFB" "false"
EndSection
