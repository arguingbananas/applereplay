# The Apple Remote (white, A1156) through the Apple TV's IR receiver: the
# kernel's hid-appleir reports its buttons as media keys, which linapple
# ignores, so triggerhappy (thd, running as apple) sends linapple the keys
# Total Replay's menu uses, with xdotool. Holding a direction repeats it.
#   Left/Right, Up/Down: the arrows, which step through the games
#   Centre (play/pause): Return, which starts the game shown
#   Menu: Ctrl+F2, linapple's cold restart, back at Total Replay's menu in
#     about 2 s. Not Ctrl+F10 (Ctrl+Reset): some games (Moon Patrol) drop to
#     the monitor on it, which the remote can't leave. Ctrl is held around the
#     key, or linapple sees a plain F2 or F10.
# KEY_ENTER is the aluminium remote's centre button (untried).
KEY_BACK        1 DISPLAY=:0 xdotool key Left
KEY_BACK        2 DISPLAY=:0 xdotool key Left
KEY_FORWARD     1 DISPLAY=:0 xdotool key Right
KEY_FORWARD     2 DISPLAY=:0 xdotool key Right
KEY_VOLUMEUP    1 DISPLAY=:0 xdotool key Up
KEY_VOLUMEUP    2 DISPLAY=:0 xdotool key Up
KEY_VOLUMEDOWN  1 DISPLAY=:0 xdotool key Down
KEY_VOLUMEDOWN  2 DISPLAY=:0 xdotool key Down
KEY_PLAYPAUSE   1 DISPLAY=:0 xdotool key Return
KEY_ENTER       1 DISPLAY=:0 xdotool key Return
KEY_MENU        1 DISPLAY=:0 xdotool keydown ctrl sleep 0.1 key F2 sleep 0.2 keyup ctrl
