# The applereplay splash, shown at once. DeviceTimeout=1: Plymouth would
# otherwise wait 8 s for a DRM device, and with nouveau blacklisted there is
# none; after the timeout it draws on the firmware's framebuffer (efifb).
# Not 0: plymouthd sets a timer with it and aborts on 0
# ("ply_event_loop_watch_for_timeout: Assertion `seconds > 0.0' failed").
[Daemon]
Theme=applereplay
ShowDelay=0
DeviceTimeout=1
