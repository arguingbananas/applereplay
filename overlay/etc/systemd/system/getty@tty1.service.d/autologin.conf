[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin apple --noclear --noissue %I $TERM
# Leave tty1 as the boot splash left it (graphics mode, its last picture) for
# X to draw over: resetting it would switch it back to text and show the
# login line and X's banner first.
TTYReset=no
TTYVHangup=no
TTYVTDisallocate=no
