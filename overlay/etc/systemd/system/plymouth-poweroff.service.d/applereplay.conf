# Start plymouthd as "@plymouthd": systemd's last shutdown step spares
# processes whose name starts with @, so the splash is still listening when
# /usr/lib/systemd/system-shutdown/applereplay-safe-to-turn-off asks it to say
# the box can be unplugged (it would otherwise be killed just before).
[Service]
ExecStart=
ExecStart=@/usr/sbin/plymouthd @plymouthd --mode=shutdown --attach-to-session
