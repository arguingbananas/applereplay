# Watch only the Apple Remote's receiver, not every input device (Debian's
# default), so a keyboard's own volume or media keys keep their meaning, and
# run the triggers as apple, who owns the X session they type into.
[Service]
ExecStart=
ExecStart=/usr/sbin/thd --triggers /etc/triggerhappy/triggers.d/ --socket /run/thd.socket --user apple /dev/input/by-id/usb-Apple_Inc._IR_Receiver-event-ir
